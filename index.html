<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAYVEE - Nền tảng du lịch & lịch trình thông minh</title>
  <meta name="description" content="Khám phá địa điểm du lịch, tạo và tối ưu hóa lịch trình thông minh tại Việt Nam cùng WAYVEE." />

  <!-- PWA & Color Scheme -->
  <meta name="theme-color" content="#00a3e0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
  <meta name="application-name" content="WAYVEE" />

  <!-- Apple iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="WAYVEE" />

  <!-- Windows & Microsoft Store Tile Support -->
  <meta name="msapplication-TileColor" content="#00a3e0" />
  <meta name="msapplication-TileImage" content="/icons/windows-square-150.png" />
  <meta name="msapplication-square70x70logo" content="/icons/windows-square-44.png" />
  <meta name="msapplication-square150x150logo" content="/icons/windows-square-150.png" />
  <meta name="msapplication-square310x310logo" content="/icons/windows-splash-300.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('wayvee-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
        } else {
          document.documentElement.dataset.theme = 'light';
        }
      } catch(e) {}
    })();
  </script>
  <style>
    /* Desktop App Startup: Prevents white flash before React hydrates */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #f8fafc;
      color: #0b2545;
      font-family: 'Plus Jakarta Sans', Inter, system-ui, -apple-system, sans-serif;
    }
    html.dark, html.dark body {
      background-color: #0b1220;
      color: #f8fafc;
    }
    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
